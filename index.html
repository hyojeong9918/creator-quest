<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Creator Quest — AI 콘텐츠 스튜디오</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800;900&family=Jua&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <aside class="side">
    <div class="sidebg">
      <img data-asset="SIDE_SRC" src="" alt="" draggable="false">
      <div class="ov ov-avatar" id="avatarSlot" data-nav="settings" role="button" tabindex="0" title="캐릭터 바꾸기"></div>
      <div class="ov ov-lv" id="lvPlate">Lv.1 Creator</div>
      <nav class="side-nav" id="nav"></nav>
      <div class="ov ov-tag">SMALL POSTS<b>BIG DREAMS</b></div>
    </div>
  </aside>

  <div class="main">
    <div class="topbar glass">
      <div class="xpwrap">
        <div class="xplab"><span id="xpName">콘텐츠 견습생</span><span id="xpNum">0 / 120 XP</span></div>
        <div class="xpbar"><div class="xpfill" id="xpFill" style="width:0%"></div></div>
      </div>
      <div class="stars" id="stars"></div>
      <span class="aichip" id="aiChip">AI 확인 중…</span>
    </div>
    <div id="screen" data-asset-bg="ENV_SRC"></div>
  </div>
</div>

<div class="dock min" id="dock">
  <button class="dock-fab" id="dockFab" aria-label="직원과 대화하기"><img data-asset="MSG_SRC" src="" alt="" draggable="false"><span class="fab-dot" id="fabDot" hidden></span></button>
  <div class="dockimg">
    <img data-asset="DOCK_SRC" src="" alt="" draggable="false">
    <button class="dock-tb" id="dockBar" aria-label="대화창 열기/닫기"></button>
    <span id="dockFace" style="display:none"></span>
    <span class="dock-name"><b id="dockName">직원</b> <small id="dockRole">담당</small></span>
    <button class="dock-min" id="dockToggle" aria-label="접기"></button>
    <div class="dock-staff" id="dockStaff"></div>
    <div class="chat-log" id="chatLog"></div>
    <textarea id="chatBox" placeholder="무엇이든 물어보세요" aria-label="직원에게 보낼 메시지"></textarea>
    <button class="chat-send" id="chatSend" aria-label="보내기"></button>
  </div>
</div>

<div class="modal-bg" id="selBg" hidden></div>
<div class="modal-bg" id="resBg" hidden></div>
<div class="modal-bg" id="edBg" hidden></div>
<div class="toast-wrap" id="toasts"></div>

<div class="modal-bg" id="modalBg" hidden>
  <div class="modal glass" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="side-tb chromebar"><b id="modalTitle">WINDOW</b><span class="dots"><i></i><i></i><i></i></span></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="js/assets.js"></script>
<script src="js/app.js"></script>
</body>
</html>
