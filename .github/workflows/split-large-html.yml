name: Split large index.html

on:
  push:
    paths:
      - .github/workflows/split-large-html.yml

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply pending fixes and split files
        run: |
          git apply tools/bugfix.patch
          node tools/split-html.js
      - name: Commit split files
        run: |
          rm -rf tools .github/workflows/split-large-html.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Split index assets into CSS and JavaScript files"
          git push origin main
